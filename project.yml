name: Tamor
options:
  developmentLanguage: en
  knownRegions: [en, ja]
  bundleIdPrefix: com.marcottlab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OPTIMIZATION_LEVEL: '-O'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
targets:
  Tamor:
    type: application
    platform: iOS
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 輸出コンプライアンス: 通信は RevenueCat SDK 経由の HTTPS のみで、
        # 独自の暗号実装を持たない（CryptoKit / CommonCrypto の使用なし）。
        # false にすることで、ビルドごとの暗号化に関する質問を省略できる。
        ITSAppUsesNonExemptEncryption: false
        RevenueCatAPIKey: $(TAMOR_REVENUECAT_API_KEY)
    sources:
      - path: Sources
        excludes: [Core/CollectionCloudStore.swift]
      - Assets.xcassets
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        TAMOR_REVENUECAT_API_KEY: appl_ZPpfsovAUxVIyOMjIbniRmIXlaO
        PRODUCT_BUNDLE_IDENTIFIER: com.marcottlab.tamor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) TAMOR'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '5'
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tamor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG TAMOR'
  TamorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Session]
    dependencies:
      - target: Tamor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TamorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: Tamor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tamor:
    build:
      targets:
        Tamor: all
    test:
      targets: [TamorTests, TamorUITests]
